name: NSLAB monitor 20220829 20260715T172100Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nslab_monitor_20220829_20260715t172100z.yml'

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record target workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out='temp/nslab_monitor_20220829_20260715t172100z'
          mkdir -p "$out"
          gh run list --repo Daikisong/new_bot --workflow nslab_gold_20220829_20260715t165500z.yml --limit 10 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,event,url,workflowName > "$out/runs.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out/runs.json"
          git commit -m 'temp: record NSLAB 20220829 run status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
