name: NSLAB push semantic probe 20180628 20260715T235900

on:
  push:
    branches:
      - nslab-probe-push-20180628-20260715t235900
    paths:
      - .github/workflows/nslab_push_model_probe_20180628_20260715t235900.yml

permissions:
  contents: write
  models: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact current news input
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: main
          path: current_main
          sparse-checkout: |
            docs/csv/news_20180628.csv
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Probe semantic model and persist result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64,csv,json,os,urllib.request
          from pathlib import Path
          with Path('current_main/docs/csv/news_20180628.csv').open(encoding='utf-8-sig',newline='') as f: row=next(csv.DictReader(f))
          body={'model':'openai/gpt-4.1','messages':[{'role':'system','content':'Read the complete Korean stock-news title and body. Return strict JSON only with source_id, disposition, exact_quote, issuer_binding_status, screening_recommendation, rejection_reason_or_null.'},{'role':'user','content':json.dumps({'source_id':'SRC-NEWS-000001','title':row['title'],'body':row['body']},ensure_ascii=False)}],'temperature':0,'max_tokens':2500}
          req=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=120) as response: data=json.loads(response.read().decode())
          content=data['choices'][0]['message']['content']
          result={'status':'SUCCESS','run_id':int(os.environ['RUN_ID']),'model':data.get('model'),'usage':data.get('usage'),'content':content}
          payload=json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          api=f"https://api.github.com/repos/{os.environ['REPO']}/contents/temp/nslab_push_probe_result_20180628_20260715t235900.json"
          put={'message':'Store current-session semantic probe result','content':base64.b64encode(payload.encode()).decode(),'branch':os.environ['BRANCH']}
          request=urllib.request.Request(api,data=json.dumps(put).encode(),method='PUT',headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=120) as response: print(response.status)
          print(content)
          PY
