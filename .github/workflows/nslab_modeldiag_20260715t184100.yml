name: NSLAB model limits diagnostic 20260715T184100

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  models: read

jobs:
  diagnose:
    if: github.head_ref == 'nslab-modeldiag-20260715t184100'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe current gpt-4o rate state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          body={
            'model':'openai/gpt-4o',
            'messages':[{'role':'system','content':'Return strict JSON.'},{'role':'user','content':'Return {"ok":true} only. Current rate probe.'}],
            'temperature':0,
            'max_tokens':20,
          }
          req=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urllib.request.urlopen(req,timeout=120) as r:
              raw=r.read().decode()
              print(json.dumps({'status':r.status,'rate_type':r.headers.get('x-ratelimit-type'),'remaining_requests':r.headers.get('x-ratelimit-remaining-requests'),'remaining_tokens':r.headers.get('x-ratelimit-remaining-tokens'),'reset_requests':r.headers.get('x-ratelimit-reset-requests'),'reset_tokens':r.headers.get('x-ratelimit-reset-tokens'),'served_model':r.headers.get('x-ms-served-model'),'body':raw[:300]},sort_keys=True))
          except urllib.error.HTTPError as e:
            print(json.dumps({'status':e.code,'rate_type':e.headers.get('x-ratelimit-type'),'retry_after':e.headers.get('Retry-After'),'error_code':e.headers.get('x-ms-error-code'),'body':e.read().decode(errors='replace')[:300]},sort_keys=True))
            raise
          PY
