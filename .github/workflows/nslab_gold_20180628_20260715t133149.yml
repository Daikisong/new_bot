name: NSLAB gold 20180628 20260715T133149

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: write
  models: read

concurrency:
  group: nslab-gold-20180628-20260715T133149-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.head_ref == 'nslab-run-20180628-20260715t133149-gold'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout current run wrapper branch
        uses: actions/checkout@v4
        with:
          path: branch_code
          sparse-checkout: |
            temp/nslab_runner_20180628_20260715t133149.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout verified parallel runner source
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: nslab-run-20220826-20260715t171800-parallel
          path: parallel_source
          sparse-checkout: |
            temp/nslab_parallel_runner_20220826_20260715t171800.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout exact current main research inputs
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: main
          path: current_main
          sparse-checkout: |
            docs/research_prompt.md
            docs/csv/news_20180628.csv
            docs/example2.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout compile-verified phase-machine source
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: 38299bfe2d296e4a8dbbaad04de2001fd63ba88a
          path: pipeline_source
          sparse-checkout: |
            temp/nslab_20220819_pipeline
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout BLIND-safe stock-web inputs only
        uses: actions/checkout@v4
        with:
          repository: Daikisong/stock-web
          ref: main
          path: stock_blind
          sparse-checkout: |
            atlas/research_daily/manifest.json
            atlas/research_daily/schema.json
            atlas/research_daily/trading_calendar.csv
            atlas/research_daily/access/2018/06/20180628.json
            atlas/research_daily/snapshots/2018/06/20180627.csv
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Cancel superseded 20180628 model-heavy runs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          current = int(os.environ['GITHUB_RUN_ID'])
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'NSLAB-20180628-current-run',
          }
          for status in ('in_progress', 'queued'):
              url = f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  runs = json.loads(response.read().decode('utf-8')).get('workflow_runs', [])
              for run in runs:
                  rid = int(run.get('id', 0))
                  name = str(run.get('name', ''))
                  if rid == current:
                      continue
                  if '20180628' not in name:
                      continue
                  if not (name.startswith('NSLAB gold') or name.startswith('NSLAB compact')):
                      continue
                  cancel = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/runs/{rid}/cancel',
                      data=b'', headers=headers, method='POST'
                  )
                  try:
                      with urllib.request.urlopen(cancel, timeout=60) as response:
                          print('cancelled', rid, name, response.status)
                  except Exception as exc:
                      print('cancel-warning', rid, name, type(exc).__name__, str(exc))
          PY

      - name: Execute complete gold phase machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python branch_code/temp/nslab_runner_20180628_20260715t133149.py

      - name: Upload independently validated episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: nslab-final-20180628-20260715T133149
          path: final_artifact_20180628_20260715t133149/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nslab-failure-20180628-20260715T133149
          path: work_parallel_20180628_20260715t133149/
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
