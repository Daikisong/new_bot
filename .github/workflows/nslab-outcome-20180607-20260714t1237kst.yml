name: NSLAB outcome 20180607 20260714t1237kst

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire_outcome:
    if: github.head_ref == 'nslab-outcome-20180607-20260714t1237kst'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch fresh post-seal outcome Raw bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outcome
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const url = 'https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180607.csv';
          const path = 'outcome/outcome_20180607_tmp.csv';
          (async () => {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'cache-control': 'no-cache',
                'pragma': 'no-cache',
                'user-agent': 'nslab-gold-phase-machine-outcome/20180607'
              }
            });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync(path, bytes);
            const manifest = {
              url,
              path,
              byte_size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              fetched_after_blind_seal: true
            };
            fs.writeFileSync('outcome/outcome_acquisition_manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload freshly acquired outcome bytes
        uses: actions/upload-artifact@v4
        with:
          name: nslab-outcome-20180607-20260714t1237kst
          path: outcome/
          if-no-files-found: error
          retention-days: 1
