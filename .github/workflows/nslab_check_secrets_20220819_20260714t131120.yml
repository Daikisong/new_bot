name: NSLAB check runtime providers 20220819 20260714t131120

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'nslab-20220819-20260714t131120'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Check provider readiness without disclosing secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          python - <<'PY'
          import os, json
          out = {
            'openai_api_key_present': bool(os.environ.get('OPENAI_API_KEY')),
            'brave_search_api_key_present': bool(os.environ.get('BRAVE_SEARCH_API_KEY')),
          }
          open('payload/provider_readiness.json','w',encoding='utf-8').write(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nslab-provider-readiness-20220819-20260714t131120
          path: payload/provider_readiness.json
          retention-days: 1
          if-no-files-found: error
