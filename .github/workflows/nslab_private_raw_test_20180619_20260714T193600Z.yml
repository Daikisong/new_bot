name: NSLAB private Raw diagnostic 20180619 20260714T193600Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref == 'nslab-private-raw-test-20180619-20260714T193600Z'
    runs-on: ubuntu-latest
    steps:
      - name: Test authenticated exact Raw and API raw fallback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          token=os.environ['GH_TOKEN']
          urls=[
            ('raw_exact','https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md',{'Authorization':f'Bearer {token}','User-Agent':'NSLAB-Private-Raw-Test/1.0','Cache-Control':'no-cache'}),
            ('api_raw','https://api.github.com/repos/Daikisong/new_bot/contents/docs/research_prompt.md?ref=main',{'Authorization':f'Bearer {token}','Accept':'application/vnd.github.raw+json','User-Agent':'NSLAB-Private-Raw-Test/1.0','X-GitHub-Api-Version':'2022-11-28'}),
          ]
          for name,url,headers in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as r: data=r.read()
                  print('RESULT',name,r.status,len(data),r.geturl())
              except urllib.error.HTTPError as e:
                  print('RESULT',name,e.code,0,e.geturl(),e.read().decode('utf-8',errors='replace')[:200])
              except Exception as e:
                  print('RESULT',name,'ERR',0,type(e).__name__,str(e))
          PY
