name: NSLAB probe 20220826 20260715T125244 fix1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nslab_probe_20220826_20260715t125244_fix1.yml'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Persist current workflow run list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out='temp/nslab_probe_20220826_20260715t125244_fix1'
          mkdir -p "$out"
          gh run list --repo Daikisong/new_bot --workflow 'NSLAB gold 20220826 20260715T125244 fix1' --limit 10 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,event,displayTitle > "$out/runs.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out/runs.json"
          git commit -m 'temp: persist repaired NSLAB 20220826 run probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

