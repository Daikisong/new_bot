name: NSLAB logdiag 29413052293 20260715T2210

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.head_ref == 'nslab-logdiag-29413052293-20260715t2210'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch cancelled run logs and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          gh run view 29413052293 --repo Daikisong/new_bot --json status,conclusion,createdAt,startedAt,updatedAt,jobs > diag/run.json
          gh run view 29413052293 --repo Daikisong/new_bot --log > diag/full.log || true
          tail -n 500 diag/full.log > diag/tail.log || true
          wc -l diag/full.log > diag/line_count.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: nslab-logdiag-29413052293-20260715T2210
          path: diag/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
