name: NSLAB current-run acquire new_bot 20220824 20260715t024535

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-acq-20220824-20260715t024535kst'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire exact main Raw prompt CSV and example
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packet/inputs
          python - <<'PY'
          import os, subprocess, urllib.request, urllib.error, json, hashlib
          from pathlib import Path
          token=os.environ['GH_TOKEN']
          items=[
            ('prompt_tmp.md','https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md','docs/research_prompt.md'),
            ('news_20220824_tmp.csv','https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220824.csv','docs/csv/news_20220824.csv'),
            ('example2.md','https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/example2.md','docs/example2.md'),
          ]
          receipt=[]
          for name,url,path in items:
              method='RAW_URL_AUTHENTICATED'
              try:
                  req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'nslab-current-run'})
                  with urllib.request.urlopen(req,timeout=120) as r: data=r.read()
              except Exception as exc:
                  method='GITHUB_CONTENTS_RAW_FALLBACK_AFTER_RAW_OPEN'
                  api=f'https://api.github.com/repos/Daikisong/new_bot/contents/{path}?ref=main'
                  req=urllib.request.Request(api,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'nslab-current-run'})
                  with urllib.request.urlopen(req,timeout=120) as r: data=r.read()
              out=Path('packet/inputs')/name
              out.write_bytes(data)
              receipt.append({'name':name,'raw_url':url,'repo_path':path,'method':method,'byte_size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          Path('packet/new_bot_acquisition_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Verify prompt and full CSV parse then rename uniquely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from datetime import datetime
          from pathlib import Path
          root=Path('packet'); inp=root/'inputs'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          p=inp/'prompt_tmp.md'; c=inp/'news_20220824_tmp.csv'
          assert p.stat().st_size==430485
          assert sha(p)=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029'
          text=p.read_text(encoding='utf-8')
          assert text.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert 'nslab.gold_phase_machine.direct_csv_research.locked' in text
          with c.open('r',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          times=[]; bad=[]
          for i,row in enumerate(rows,1):
              try: times.append(datetime.fromisoformat(f"{row['date']}T{row['time']}"))
              except Exception: bad.append(i)
          assert not bad
          news_sha=sha(c)
          prompt_name='research_prompt_20260715T024535KST_b5ba21ce.md'
          news_name=f'news_20220824_20260715T024535KST_{news_sha[:8]}.csv'
          p.rename(inp/prompt_name); c.rename(inp/news_name)
          meta={
            'prompt_file':prompt_name,'prompt_sha256':sha(inp/prompt_name),'prompt_byte_size':(inp/prompt_name).stat().st_size,
            'news_file':news_name,'news_sha256':news_sha,'news_byte_size':(inp/news_name).stat().st_size,
            'csv_row_count':len(rows),'parsed_row_count':len(rows),'columns':list(rows[0]),
            'min_published_at':min(times).isoformat(),'max_published_at':max(times).isoformat(),'time_unverified_rows':[],
            'control_char_count':sum(1 for ch in (inp/news_name).read_text(encoding='utf-8-sig') if ord(ch)<32 and ch not in '\n\r\t')
          }
          (root/'new_bot_metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload current-run new_bot inputs
        uses: actions/upload-artifact@v4
        with:
          name: nslab-current-newbot-20220824-20260715t024535
          path: packet/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
