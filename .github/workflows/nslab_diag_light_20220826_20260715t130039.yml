name: NSLAB diagnostic light 20220826 20260715T130039

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'nslab-run-20220826-20260715t130039'
    runs-on: ubuntu-latest
    steps:
      - name: Print latest target runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo Daikisong/new_bot --workflow nslab_gold_pr_20220826_20260715t130039.yml --limit 12 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url
