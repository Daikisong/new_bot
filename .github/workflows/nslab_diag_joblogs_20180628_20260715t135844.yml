name: NSLAB diagnostic job logs 20180628 20260715T135844

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: github.head_ref == 'nslab-diag-joblogs-20180628-20260715t135844'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download completed job logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.github.com/repos/Daikisong/new_bot/actions/jobs/87345505087/logs'
          curl --silent --show-error --fail --max-redirs 0 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -D headers.txt -o /dev/null "$API" || test "$?" -eq 47
          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' headers.txt)"
          test -n "$LOCATION"
          curl --silent --show-error --fail --location "$LOCATION" -o joblogs.txt
          file joblogs.txt
          wc -c joblogs.txt
          tail -n 260 joblogs.txt > tail.txt
          grep -Ein 'error|exception|traceback|cancel|semantic|FULL_ROW|blind|seal|outcome|postmortem|brain_delta|ACCEPT_FULL|HTTP 4|HTTP 5|rate|retry' joblogs.txt > signals.txt || true
          tail -n 260 signals.txt > signals_tail.txt
          printf '%s\n' '===== JOB LOG TAIL ====='
          cat tail.txt
          printf '%s\n' '===== SIGNAL TAIL ====='
          cat signals_tail.txt
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: nslab-joblogs-20180628-20260715T135844
          path: |
            joblogs.txt
            tail.txt
            signals.txt
            signals_tail.txt
            headers.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
