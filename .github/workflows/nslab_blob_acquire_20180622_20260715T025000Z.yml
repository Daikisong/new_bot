name: NSLAB blob acquire 20180622 20260715T025000Z

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'temp/nslab_blob_acquire_20180622_20260715T025000Z/trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-blob-acquire-20180622-20260715T025000Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact current main blobs with repository token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packet
          python - <<'PY'
          import base64,csv,hashlib,json,os,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          targets={
            'prompt':('e33e16c05fddfcc92883fc99fb688871f45e1fc0','packet/prompt_tmp.md'),
            'news':('c37e515994623403ef73c8af20d7def919d88bd2','packet/news_20180622_tmp.csv'),
          }
          receipt={'schema_version':'nslab.current_run_blob_acquisition.v1','repository':repo}
          for name,(sha,out) in targets.items():
              url=f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'nslab-current-run-blob-acquire'})
              with urllib.request.urlopen(req,timeout=120) as r: obj=json.loads(r.read().decode('utf-8'))
              data=base64.b64decode(obj['content'])
              gitsha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if gitsha!=sha: raise RuntimeError(f'{name} blob sha mismatch {gitsha} != {sha}')
              Path(out).write_bytes(data)
              receipt[name]={'blob_sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'byte_size':len(data),'api_url':url}
          pb=Path('packet/prompt_tmp.md').read_bytes(); nb=Path('packet/news_20180622_tmp.csv').read_bytes()
          assert hashlib.sha256(pb).hexdigest()=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029'
          assert len(pb)==430485
          pt=pb.decode('utf-8'); assert pt.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'; assert 'nslab.gold_phase_machine.direct_csv_research.locked' in pt
          with Path('packet/news_20180622_tmp.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          if not rows or list(rows[0])!=['page','row','date','time','title','body']: raise RuntimeError('CSV parse/schema failure')
          receipt['csv_row_count']=len(rows); receipt['columns']=list(rows[0]); receipt['status']='CURRENT_RUN_EXACT_BLOBS_VERIFIED'
          Path('packet/acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nslab-blob-acquire-20180622-20260715T025000Z
          path: packet/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
