name: NSLAB outcome 20220819 seal 223f5ba1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire_outcome_postseal:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact D outcome only after verified blind seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          printf '%s\n' '223f5ba131a2396d6caf237ce4bd6c7cf3ecea8ffe7eeaee82574e7c646cf9d9' > payload/verified_blind_packet_manifest_sha256.txt
          printf '%s\n' 'PASS' > payload/blind_validation_status.txt
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2022/08/20220819.csv' \
            -o payload/outcome_snapshot_20220819_tmp.csv
          test "$(sha256sum payload/outcome_snapshot_20220819_tmp.csv | awk '{print $1}')" = '68cd269f827703534198b1ad0dd1be5b7b28d3dd35ec7b4f49ba81df914cde32'
          test "$(wc -c < payload/outcome_snapshot_20220819_tmp.csv | tr -d ' ')" = '817772'
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('payload/outcome_snapshot_20220819_tmp.csv')
          with p.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2432, len(rows)
          out={'row_count':len(rows),'columns':list(rows[0].keys()) if rows else []}
          Path('payload/outcome_parse_receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          {
            sha256sum payload/outcome_snapshot_20220819_tmp.csv
            wc -c payload/outcome_snapshot_20220819_tmp.csv
            head -n 1 payload/outcome_snapshot_20220819_tmp.csv
          } > payload/outcome_acquisition_receipt.txt

      - name: Upload exact post-seal outcome bytes
        uses: actions/upload-artifact@v4
        with:
          name: nslab-outcome-20220819-seal-223f5ba1
          path: payload/
          if-no-files-found: error
          retention-days: 1
