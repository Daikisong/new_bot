name: NSLAB acquire 20180622 20260715T022333Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'temp/nslab_acquire_20180622_20260715T022333Z/trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-acquire-20180622-20260715T022333Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact current main inputs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            docs/research_prompt.md
            docs/csv/news_20180622.csv
            docs/example2.md
          sparse-checkout-cone-mode: false
          path: repo
      - name: Verify and package fresh bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh/docs/csv
          cp repo/docs/research_prompt.md fresh/docs/research_prompt.md
          cp repo/docs/csv/news_20180622.csv fresh/docs/csv/news_20180622.csv
          cp repo/docs/example2.md fresh/docs/example2.md
          python - <<'PY'
          import csv, hashlib, json
          from datetime import datetime
          from pathlib import Path
          root=Path('fresh')
          prompt=root/'docs/research_prompt.md'
          news=root/'docs/csv/news_20180622.csv'
          example=root/'docs/example2.md'
          p=prompt.read_bytes(); n=news.read_bytes(); e=example.read_bytes()
          ps=hashlib.sha256(p).hexdigest(); ns=hashlib.sha256(n).hexdigest(); es=hashlib.sha256(e).hexdigest()
          assert ps=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029'
          assert len(p)==430485
          text=p.decode('utf-8')
          assert text.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert 'nslab.gold_phase_machine.direct_csv_research.locked' in text
          with news.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          times=[]; bad=[]
          for i,row in enumerate(rows,1):
              try: times.append(datetime.fromisoformat(f"{row['date']}T{row['time']}+09:00"))
              except Exception: bad.append(i)
          receipt={'schema_version':'nslab.current_run_raw_acquisition.v1','status':'VERIFIED','prompt_sha256':ps,'prompt_byte_size':len(p),'news_sha256':ns,'news_byte_size':len(n),'csv_row_count':len(rows),'columns':list(rows[0]),'min_published_at':min(times).isoformat() if times else None,'max_published_at':max(times).isoformat() if times else None,'time_unverified_rows':bad,'example_sha256':es,'example_byte_size':len(e)}
          (root/'acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload fresh inputs
        uses: actions/upload-artifact@v4
        with:
          name: nslab-fresh-inputs-20180622-20260715T022333Z
          path: fresh/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
