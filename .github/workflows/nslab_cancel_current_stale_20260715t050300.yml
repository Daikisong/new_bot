name: NSLAB cancel current stale model runs 20260715T050300

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read

jobs:
  cancel_stale:
    if: github.head_ref == 'nslab-cancel-current-stale-20260715t050300kst'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel superseded model-heavy runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for RUN_ID in 29364336964 29360585036 29361185923 29362076416 29358558986; do
            code=$(curl -sS -o "cancel_${RUN_ID}.txt" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/Daikisong/new_bot/actions/runs/${RUN_ID}/cancel" || true)
            echo "run=${RUN_ID} http=${code} response=$(cat cancel_${RUN_ID}.txt 2>/dev/null || true)"
            case "$code" in 202|409|404) ;; *) exit 1;; esac
          done
