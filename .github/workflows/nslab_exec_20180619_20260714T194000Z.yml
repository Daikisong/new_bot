name: NSLAB exec 20180619 20260714T200000Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: nslab-exec-20180619-20260714T200000Z-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gold:
    if: github.head_ref == 'nslab-exec-20180619-20260714T200000Z'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      RUN_ROOT: run_root/nslab_run_20260714T200000Z
    steps:
      - name: Checkout pinned orchestration scripts
        uses: actions/checkout@v4
        with:
          repository: Daikisong/stock-web
          ref: nslab-gold-20180619-20260714T172911Z
          path: runner
          sparse-checkout: temp/nslab_20180619_20260714T172911Z
          sparse-checkout-cone-mode: false

      - name: Checkout compile-verified phase-machine source
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: 38299bfe2d296e4a8dbbaad04de2001fd63ba88a
          path: pipeline_checkout
          sparse-checkout: temp/nslab_20220819_pipeline
          sparse-checkout-cone-mode: false

      - name: Fresh exact Raw acquisition and verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ACQUIRED="$RUN_ROOT/acquired"
          mkdir -p "$ACQUIRED/new_bot/docs/csv" "$ACQUIRED/stock/atlas/research_daily/snapshots/2018/06" "$ACQUIRED/stock/atlas/research_daily/access/2018/06" "$ACQUIRED/stock/atlas/research_daily" "$ACQUIRED/pipeline_source/temp" "$ACQUIRED/run_inputs"
          : > "$ACQUIRED/new_bot/docs/example2.md"
          cp -R pipeline_checkout/temp/nslab_20220819_pipeline "$ACQUIRED/pipeline_source/temp/"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const root=process.env.RUN_ROOT+'/acquired';
          const raw='https://raw.githubusercontent.com';
          const token=process.env.GH_TOKEN;
          const targets={
            prompt:{url:`${raw}/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md`,out:`${root}/new_bot/docs/research_prompt.md`,auth:true},
            news:{url:`${raw}/Daikisong/new_bot/refs/heads/main/docs/csv/news_20180619.csv`,out:`${root}/new_bot/docs/csv/news_20180619.csv`,auth:true},
            access:{url:`${raw}/Daikisong/stock-web/refs/heads/main/atlas/research_daily/access/2018/06/20180619.json`,out:`${root}/stock/atlas/research_daily/access/2018/06/20180619.json`,auth:false},
            manifest:{url:`${raw}/Daikisong/stock-web/refs/heads/main/atlas/research_daily/manifest.json`,out:`${root}/stock/atlas/research_daily/manifest.json`,auth:false},
            schema:{url:`${raw}/Daikisong/stock-web/refs/heads/main/atlas/research_daily/schema.json`,out:`${root}/stock/atlas/research_daily/schema.json`,auth:false},
            calendar:{url:`${raw}/Daikisong/stock-web/refs/heads/main/atlas/research_daily/trading_calendar.csv`,out:`${root}/stock/atlas/research_daily/trading_calendar.csv`,auth:false},
            blind:{url:`${raw}/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180618.csv`,out:`${root}/stock/atlas/research_daily/snapshots/2018/06/20180618.csv`,auth:false}
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function download(name,spec){let last='';for(let attempt=1;attempt<=7;attempt++){try{const headers={'cache-control':'no-cache, no-store, max-age=0','pragma':'no-cache','user-agent':'nslab-gold-current-run-20180619-20260714T200000Z'};if(spec.auth)headers.authorization=`Bearer ${token}`;const sep=spec.url.includes('?')?'&':'?';const response=await fetch(spec.url+sep+`nslab_current_run=20260714T200000Z_${Date.now()}_${Math.random()}`,{redirect:'follow',cache:'no-store',signal:AbortSignal.timeout(120000),headers});if(!response.ok)throw new Error(`HTTP ${response.status}`);const bytes=Buffer.from(await response.arrayBuffer());fs.mkdirSync(path.dirname(spec.out),{recursive:true});fs.writeFileSync(spec.out,bytes);const meta={url:spec.url,byte_size:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),fetched_at:new Date().toISOString(),attempt,authenticated:spec.auth};console.log(JSON.stringify({name,...meta}));return meta;}catch(error){last=String(error);console.error(JSON.stringify({name,attempt,error:last}));if(attempt<7)await sleep(1500*attempt);}}throw new Error(`${name} failed: ${last}`);}
          (async()=>{const receipt={schema_version:'nslab.raw_download_receipt.v7',run_id:'NSLAB-WEB-20180619-20260714T200000Z'};for(const [name,spec] of Object.entries(targets))receipt[name]=await download(name,spec);fs.writeFileSync(`${root}/raw_download_receipt.json`,JSON.stringify(receipt,null,2)+'\n');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python runner/temp/nslab_20180619_20260714T172911Z/acquire_verify_raw.py "$ACQUIRED"
          python - <<'PY'
          import csv,hashlib,json,os,shutil
          from datetime import datetime
          from pathlib import Path
          root=Path(os.environ['RUN_ROOT'])/'acquired'; prompt=root/'new_bot/docs/research_prompt.md'; news=root/'new_bot/docs/csv/news_20180619.csv'; blind=root/'stock/atlas/research_daily/snapshots/2018/06/20180618.csv'
          p=prompt.read_bytes(); n=news.read_bytes(); b=blind.read_bytes(); psha=hashlib.sha256(p).hexdigest(); nsha=hashlib.sha256(n).hexdigest(); bsha=hashlib.sha256(b).hexdigest()
          assert psha=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029' and len(p)==430485
          assert p.decode('utf-8').splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert nsha=='3b5712940be4426bc6e31434d85a364074f33a300bead25b7e264cd66e87807a' and len(n)==2379689
          with news.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==819 and list(rows[0])==['page','row','date','time','title','body']
          ts=[datetime.fromisoformat(f"{r['date']}T{r['time']}+09:00") for r in rows]; assert min(ts).isoformat()=='2018-06-18T15:30:00+09:00' and max(ts).isoformat()=='2018-06-19T08:57:58+09:00'
          access=json.loads((root/'stock/atlas/research_daily/access/2018/06/20180619.json').read_text(encoding='utf-8'))
          with blind.open(encoding='utf-8-sig',newline='') as f: brows=list(csv.DictReader(f))
          assert bsha==access['blind_snapshot_sha256']=='43cd5a9efcf00e8d972666c84c2d750081d20244ef329dd4a9daf1796abb5071' and len(b)==718749 and len(brows)==2124
          assert not (root/'stock/atlas/research_daily/snapshots/2018/06/20180619.csv').exists()
          shutil.copyfile(prompt,root/f'run_inputs/research_prompt_20260714T200000Z_{psha[:8]}.md'); shutil.copyfile(news,root/f'run_inputs/news_20180619_20260714T200000Z_{nsha[:8]}.csv'); shutil.copyfile(blind,root/f'run_inputs/blind_snapshot_20180618_20260714T200000Z_{bsha[:8]}.csv')
          receipt=json.loads((root/'acquisition_verification.json').read_text(encoding='utf-8')); receipt.update({'run_id':'NSLAB-WEB-20180619-20260714T200000Z','input_coverage_warning':'CSV actual max timestamp 2018-06-19T08:57:58+09:00 is before cutoff 2018-06-19T08:59:59+09:00.','uncovered_time_ranges':['2018-06-19T08:57:59+09:00..2018-06-19T08:59:59+09:00'],'preseal_outcome_content_access_count':0}); (root/'acquisition_verification.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          python -m py_compile "$ACQUIRED/pipeline_source/temp/nslab_20220819_pipeline"/{common.py,blind.py,reseal.py,postmortem.py}

      - name: Full 819-row title-body semantic review population
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          root=Path(os.environ['RUN_ROOT']); out=root/'review_shards'; out.mkdir(parents=True,exist_ok=True)
          base=['python','runner/temp/nslab_20180619_20260714T172911Z/review_shard.py','--pipeline',str(root/'acquired/pipeline_source/temp/nslab_20220819_pipeline'),'--news',str(root/'acquired/new_bot/docs/csv/news_20180619.csv'),'--blind',str(root/'acquired/stock/atlas/research_daily/snapshots/2018/06/20180618.csv'),'--shard-count','64']
          def run(shard):
              cmd=base+['--shard',str(shard),'--output',str(out/f'review_shard_{shard:03d}.jsonl')]
              subprocess.run(cmd,check=True)
              return shard
          with ThreadPoolExecutor(max_workers=16) as pool:
              futures={pool.submit(run,s):s for s in range(64)}
              for future in as_completed(futures):
                  print('SHARD_DONE',future.result(),flush=True)
          PY

      - name: Close PHASE 1 population and verified BLIND seal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python runner/temp/nslab_20180619_20260714T172911Z/combine_reviews.py "$RUN_ROOT/review_shards" "$RUN_ROOT/combined"
          cat runner/temp/nslab_20180619_20260714T172911Z/orchestrate.part0* > runner/temp/nslab_20180619_20260714T172911Z/orchestrate.py
          sed -i 's/20260714T172911Z/20260714T200000Z/g' runner/temp/nslab_20180619_20260714T172911Z/orchestrate.py
          python -m py_compile runner/temp/nslab_20180619_20260714T172911Z/orchestrate.py
          python runner/temp/nslab_20180619_20260714T172911Z/orchestrate.py blind --input-root "$RUN_ROOT/acquired" --pipeline-source "$RUN_ROOT/acquired/pipeline_source" --reviews "$RUN_ROOT/combined/reviews.jsonl" --work "$RUN_ROOT/current_work"
          python runner/temp/nslab_20180619_20260714T172911Z/orchestrate.py verify-seal --blind-root "$RUN_ROOT/current_work"
          test ! -e "$RUN_ROOT/stock_outcome/atlas/research_daily/snapshots/2018/06/20180619.csv"

      - name: Fresh D outcome acquisition after verified seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/stock_outcome/atlas/research_daily/snapshots/2018/06" "$RUN_ROOT/stock_outcome/run_inputs"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');const root=process.env.RUN_ROOT+'/stock_outcome';const url='https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180619.csv';const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{let last='';for(let attempt=1;attempt<=7;attempt++){try{const r=await fetch(url+`?nslab_postseal=20260714T200000Z_${Date.now()}_${Math.random()}`,{redirect:'follow',cache:'no-store',signal:AbortSignal.timeout(120000),headers:{'cache-control':'no-cache, no-store, max-age=0','pragma':'no-cache','user-agent':'nslab-gold-postseal-20180619-20260714T200000Z'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const b=Buffer.from(await r.arrayBuffer()),sha=crypto.createHash('sha256').update(b).digest('hex');const out=`${root}/atlas/research_daily/snapshots/2018/06/20180619.csv`;fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,b);fs.writeFileSync(`${root}/run_inputs/outcome_snapshot_20180619_20260714T200000Z_${sha.slice(0,8)}.csv`,b);fs.writeFileSync(`${root}/outcome_raw_receipt.json`,JSON.stringify({url,byte_size:b.length,sha256:sha,fetched_at:new Date().toISOString(),attempt,opened_after_verified_blind_seal:true},null,2)+'\n');return;}catch(e){last=String(e);if(attempt<7)await sleep(1500*attempt);}}throw new Error(last);})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Full-market postmortem brain delta final reparse and importer validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python runner/temp/nslab_20180619_20260714T172911Z/orchestrate.py postmortem --blind-root "$RUN_ROOT/current_work" --stock "$RUN_ROOT/stock_outcome" --output "$RUN_ROOT/final_output" --required-blocks runner/temp/nslab_20180619_20260714T172911Z/required_blocks.json
          test -s "$RUN_ROOT/final_output/20180619_nslab_episode_bundle.md"

      - name: Checkout current importer
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: main
          path: validator_repo

      - name: Independent current importer validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -e validator_repo
          python runner/temp/nslab_20180619_20260714T172911Z/import_validate.py "$RUN_ROOT/final_output"

      - name: Upload validated episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: nslab-final-20180619-20260714T200000Z
          path: |
            run_root/nslab_run_20260714T200000Z/final_output/20180619_nslab_episode_bundle.md
            run_root/nslab_run_20260714T200000Z/final_output/independent_final_validation_receipt.json
            run_root/nslab_run_20260714T200000Z/final_output/final_reparse_receipt.json
            run_root/nslab_run_20260714T200000Z/final_output/repo_import_inspection.json
            run_root/nslab_run_20260714T200000Z/final_output/outcome_receipt.json
            run_root/nslab_run_20260714T200000Z/current_work/blind_completion_receipt.json
            run_root/nslab_run_20260714T200000Z/current_work/seal_independent_verification.json
            run_root/nslab_run_20260714T200000Z/combined/semantic_review_population_receipt.json
            run_root/nslab_run_20260714T200000Z/acquired/acquisition_verification.json
            run_root/nslab_run_20260714T200000Z/acquired/raw_download_receipt.json
            run_root/nslab_run_20260714T200000Z/stock_outcome/outcome_raw_receipt.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
