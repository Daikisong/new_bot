name: NSLAB temp blind 20180605 20260714t0202

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire_blind:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch blind-safe stock-web Raw inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/trading_calendar.csv' \
            -o payload/trading_calendar_tmp.csv
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180604.csv' \
            -o payload/blind_snapshot_20180604_tmp.csv
          {
            sha256sum payload/trading_calendar_tmp.csv
            wc -c payload/trading_calendar_tmp.csv
            head -n 2 payload/trading_calendar_tmp.csv
            sha256sum payload/blind_snapshot_20180604_tmp.csv
            wc -c payload/blind_snapshot_20180604_tmp.csv
            head -n 1 payload/blind_snapshot_20180604_tmp.csv
          } > payload/blind_acquisition_receipt.txt
      - name: Upload blind-safe exact bytes
        uses: actions/upload-artifact@v4
        with:
          name: nslab-blind-20180605-20260714t0202
          path: payload/
          if-no-files-found: error
          retention-days: 1
