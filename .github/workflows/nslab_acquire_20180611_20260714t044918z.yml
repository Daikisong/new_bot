name: NSLAB outcome snapshot 20180611 20260714t044918z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire_outcome:
    if: github.head_ref == 'nslab-acquire-20180611-20260714t044918z'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch post-seal outcome snapshot Raw bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquired_outcome
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const url = 'https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180611.csv';
          const path = 'acquired_outcome/outcome_snapshot_20180611_tmp.csv';
          (async () => {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'cache-control': 'no-cache',
                'pragma': 'no-cache',
                'user-agent': 'nslab-gold-phase-machine/20180611-postseal'
              }
            });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync(path, bytes);
            const manifest = {
              phase: 'POSTSEAL_OUTCOME_ONLY',
              url,
              path,
              byte_size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              first_line: bytes.toString('utf8').split(/\r?\n/, 1)[0]
            };
            fs.writeFileSync('acquired_outcome/outcome_acquisition_manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload freshly acquired outcome snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nslab-outcome-20180611-20260714t044918z
          path: acquired_outcome/
          if-no-files-found: error
          retention-days: 1
