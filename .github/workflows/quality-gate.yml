name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/news_scalping_lab
      - name: Schema parity
        run: python -m pytest -q tests/unit/test_project_scaffold.py -k schema
      - name: Production targeted regression
        run: >-
          python -m pytest -q
          tests/unit/test_event_clusters.py
          tests/unit/test_memory_cells.py
          tests/unit/test_population_retrieval.py
          tests/unit/test_representative_selection.py
          tests/unit/test_llm_full_brain_compiler.py
          tests/unit/test_production_promotion.py
          tests/unit/test_shadow_evaluation.py
          tests/unit/test_daily_memory_context.py
          tests/unit/test_versioned_bundle_records.py
          tests/unit/test_evidence_policy.py
          tests/unit/test_codex_oauth_provider.py
          tests/unit/test_github_ruleset_policy.py
          tests/unit/test_local_embedding_snapshot.py
          tests/unit/test_production_embedding_policy.py
          tests/unit/test_production_bootstrap_local.py
      - name: Full pytest
        run: python -m pytest
      - name: Generated drift and whitespace
        run: git diff --check && git diff --exit-code
