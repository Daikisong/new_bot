name: NSLAB temp repo tools 20220817 20260714t110254

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  package_tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Package current repo tools and gold shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          tar \
            --exclude='./.git' \
            --exclude='./docs/csv' \
            --exclude='./research/episodes' \
            --exclude='./output' \
            --exclude='./outputs' \
            --exclude='./.venv' \
            --exclude='./venv' \
            -czf payload/new_bot_tools_main.tar.gz .
          sha256sum payload/new_bot_tools_main.tar.gz > payload/repo_tools_receipt.txt
          wc -c payload/new_bot_tools_main.tar.gz >> payload/repo_tools_receipt.txt
      - name: Upload current repo tools
        uses: actions/upload-artifact@v4
        with:
          name: nslab-repo-tools-20220817-20260714t110254
          path: payload/
          if-no-files-found: error
          retention-days: 1
