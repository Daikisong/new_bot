name: NSLAB cancel obsolete model runs 20260714T130100Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    if: github.head_ref == 'nslab-cancel-obsolete-20260714T130100Z'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel obsolete superseded model runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 29314630814 29323399485; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/Daikisong/new_bot/actions/runs/${run_id}/cancel")
            cat "$body"
            echo "run_id=${run_id} http=${code}"
            case "$code" in
              202|409) ;;
              *) exit 1 ;;
            esac
          done
