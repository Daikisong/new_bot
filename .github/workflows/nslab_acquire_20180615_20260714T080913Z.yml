name: NSLAB outcome 20180615 20260714T082931Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire_outcome:
    if: github.head_ref == 'nslab-acquire-20180615-20260714T080913Z'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch fresh post-seal outcome Raw bytes only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outcome
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const url = 'https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180615.csv';
          (async () => {
            const response = await fetch(url + '?nslab_run=20260714T082931Z_outcome', {
              redirect: 'follow',
              headers: {
                'cache-control': 'no-cache',
                'pragma': 'no-cache',
                'user-agent': 'nslab-gold-phase-machine/20180615-outcome'
              }
            });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync('outcome/outcome_20180615_tmp.csv', bytes);
            fs.writeFileSync('outcome/outcome_manifest.json', JSON.stringify({
              url,
              byte_size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex')
            }, null, 2) + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload freshly acquired post-seal outcome
        uses: actions/upload-artifact@v4
        with:
          name: nslab-outcome-20180615-20260714T082931Z
          path: outcome/
          if-no-files-found: error
          retention-days: 1
