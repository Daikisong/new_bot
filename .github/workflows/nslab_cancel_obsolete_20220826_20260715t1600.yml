name: NSLAB cancel obsolete 20220826 runs 20260715T1600

on:
  push:
    branches:
      - nslab-maint-cancel-20220826-20260715t1600

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded NSLAB 20220826 model runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 29389340461 29389667839; do
            status=$(curl -sS -o /tmp/cancel_${run_id}.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel")
            cat /tmp/cancel_${run_id}.json || true
            test "${status}" = '202' || test "${status}" = '409'
          done
