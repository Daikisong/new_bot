name: NSLAB acquire 20180628 20260715T093941Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'temp/nslab_acquire_20180628_20260715T093941Z/trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-acquire-20180628-20260715T093941Z'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact current new_bot main inputs
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            docs/research_prompt.md
            docs/csv/news_20180628.csv
            docs/example2.md
          sparse-checkout-cone-mode: false
          path: new_bot
      - name: Checkout exact current stock-web main blind inputs only
        uses: actions/checkout@v4
        with:
          repository: Daikisong/stock-web
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            atlas/research_daily/manifest.json
            atlas/research_daily/schema.json
            atlas/research_daily/trading_calendar.csv
            atlas/research_daily/access/2018/06/20180628.json
            atlas/research_daily/snapshots/2018/06/20180627.csv
          sparse-checkout-cone-mode: false
          path: stock_web
      - name: Verify and package fresh pre-seal bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh/new_bot/docs/csv fresh/stock_web/atlas/research_daily/access/2018/06 fresh/stock_web/atlas/research_daily/snapshots/2018/06
          cp new_bot/docs/research_prompt.md fresh/new_bot/docs/research_prompt.md
          cp new_bot/docs/csv/news_20180628.csv fresh/new_bot/docs/csv/news_20180628.csv
          cp new_bot/docs/example2.md fresh/new_bot/docs/example2.md
          cp stock_web/atlas/research_daily/manifest.json fresh/stock_web/atlas/research_daily/manifest.json
          cp stock_web/atlas/research_daily/schema.json fresh/stock_web/atlas/research_daily/schema.json
          cp stock_web/atlas/research_daily/trading_calendar.csv fresh/stock_web/atlas/research_daily/trading_calendar.csv
          cp stock_web/atlas/research_daily/access/2018/06/20180628.json fresh/stock_web/atlas/research_daily/access/2018/06/20180628.json
          cp stock_web/atlas/research_daily/snapshots/2018/06/20180627.csv fresh/stock_web/atlas/research_daily/snapshots/2018/06/20180627.csv
          python - <<'PY'
          import csv, hashlib, json
          from datetime import datetime
          from pathlib import Path
          root=Path('fresh')
          prompt=root/'new_bot/docs/research_prompt.md'
          news=root/'new_bot/docs/csv/news_20180628.csv'
          example=root/'new_bot/docs/example2.md'
          manifest=root/'stock_web/atlas/research_daily/manifest.json'
          schema=root/'stock_web/atlas/research_daily/schema.json'
          calendar=root/'stock_web/atlas/research_daily/trading_calendar.csv'
          access=root/'stock_web/atlas/research_daily/access/2018/06/20180628.json'
          blind=root/'stock_web/atlas/research_daily/snapshots/2018/06/20180627.csv'
          p=prompt.read_bytes(); n=news.read_bytes(); e=example.read_bytes(); m=manifest.read_bytes(); s=schema.read_bytes(); c=calendar.read_bytes(); a=access.read_bytes(); b=blind.read_bytes()
          ps=hashlib.sha256(p).hexdigest(); ns=hashlib.sha256(n).hexdigest(); es=hashlib.sha256(e).hexdigest(); ms=hashlib.sha256(m).hexdigest(); ss=hashlib.sha256(s).hexdigest(); cs=hashlib.sha256(c).hexdigest(); acs=hashlib.sha256(a).hexdigest(); bs=hashlib.sha256(b).hexdigest()
          assert ps=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029'
          assert len(p)==430485
          text=p.decode('utf-8')
          assert text.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert 'nslab.gold_phase_machine.direct_csv_research.locked' in text
          with news.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          times=[]; bad=[]
          for i,row in enumerate(rows,1):
              try: times.append(datetime.fromisoformat(f"{row['date']}T{row['time']}+09:00"))
              except Exception: bad.append(i)
          access_meta=json.loads(a.decode('utf-8'))
          assert access_meta['trade_date']=='2018-06-28'
          assert access_meta['previous_trade_date']=='2018-06-27'
          assert access_meta['blind_snapshot_path']=='atlas/research_daily/snapshots/2018/06/20180627.csv'
          assert bs==access_meta['blind_snapshot_sha256']=='b9830047f6dbdfd9ec6d239edcc5f0b48d32ef1cf4eac6f61b52a9feac785db8'
          assert len(b)==access_meta['blind_snapshot_bytes']==717625
          with blind.open(encoding='utf-8',newline='') as f: blind_rows=list(csv.DictReader(f))
          assert len(blind_rows)==access_meta['blind_snapshot_row_count']==2126
          assert {r['snapshot_date'] for r in blind_rows}=={'2018-06-27'}
          receipt={'schema_version':'nslab.current_run_raw_acquisition.v1','status':'VERIFIED','acquisition_phase':'PRESEAL','preseal_outcome_download_count':0,'prompt_sha256':ps,'prompt_byte_size':len(p),'news_sha256':ns,'news_byte_size':len(n),'csv_row_count':len(rows),'columns':list(rows[0]),'min_published_at':min(times).isoformat() if times else None,'max_published_at':max(times).isoformat() if times else None,'time_unverified_rows':bad,'example_sha256':es,'example_byte_size':len(e),'manifest_sha256':ms,'manifest_byte_size':len(m),'schema_sha256':ss,'schema_byte_size':len(s),'calendar_sha256':cs,'calendar_byte_size':len(c),'access_sha256':acs,'access_byte_size':len(a),'blind_snapshot_sha256':bs,'blind_snapshot_byte_size':len(b),'blind_snapshot_row_count':len(blind_rows)}
          (root/'acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload fresh pre-seal inputs
        uses: actions/upload-artifact@v4
        with:
          name: nslab-fresh-preseal-20180628-20260715T093941Z
          path: fresh/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
