name: NSLAB mini probe 20260715T1412

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  models: read

jobs:
  probe:
    if: github.head_ref == 'nslab-mini-probe-20260715t1412'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe gpt-4.1-mini
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          body={
            'model':'openai/gpt-4.1-mini',
            'messages':[{'role':'system','content':'Return strict JSON.'},{'role':'user','content':'Return {"ok":true} only.'}],
            'temperature':0,
            'max_tokens':100,
          }
          req=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps(body).encode(),headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          started=time.time()
          try:
            with urllib.request.urlopen(req,timeout=60) as response:
              data=response.read().decode()
              print(json.dumps({'status':response.status,'elapsed':time.time()-started,'body':data[:1000]}))
          except urllib.error.HTTPError as exc:
            print(json.dumps({'status':exc.code,'elapsed':time.time()-started,'body':exc.read().decode(errors='replace')[:1000]}))
            raise
          PY
