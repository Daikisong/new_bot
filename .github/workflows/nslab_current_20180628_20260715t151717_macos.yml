name: NSLAB current fresh gold 20180628 macOS 20260715T151717

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nslab_current_20180628_20260715t151717_macos.yml'

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: nslab-current-fresh-gold-20180628-macos-20260715T151717
  cancel-in-progress: false

jobs:
  execute:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current execution wrapper branch
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: nslab-run-20180628-20260715t101000-compact
          path: branch_code
          sparse-checkout: |
            temp/nslab_compact_wrapper_20180628_20260715t101000.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout verified parallel runner source
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: nslab-run-20220826-20260715t171800-parallel
          path: parallel_source
          sparse-checkout: |
            temp/nslab_parallel_runner_20220826_20260715t171800.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout exact current-main research inputs
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: main
          path: current_main
          sparse-checkout: |
            docs/research_prompt.md
            docs/csv/news_20180628.csv
            docs/example2.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout compile-verified phase-machine source
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: 38299bfe2d296e4a8dbbaad04de2001fd63ba88a
          path: pipeline_source
          sparse-checkout: |
            temp/nslab_20220819_pipeline
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout BLIND-safe stock-web routing and P snapshot only
        uses: actions/checkout@v4
        with:
          repository: Daikisong/stock-web
          ref: main
          path: stock_blind
          sparse-checkout: |
            atlas/research_daily/manifest.json
            atlas/research_daily/schema.json
            atlas/research_daily/trading_calendar.csv
            atlas/research_daily/access/2018/06/20180628.json
            atlas/research_daily/snapshots/2018/06/20180627.csv
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Execute complete fresh gold phase machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 branch_code/temp/nslab_compact_wrapper_20180628_20260715t101000.py

      - name: Upload independently validated episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: nslab-final-20180628-20260715T151717-macos
          path: final_artifact_20180628_20260715t101000/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nslab-failure-20180628-20260715T151717-macos
          path: work_parallel_20180628_20260715t150152z/
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
