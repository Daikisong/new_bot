name: NSLAB acquire2 20180622 20260715T024500Z

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'temp/nslab_acquire2_20180622_20260715T024500Z/trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.event.pull_request.head.ref == 'nslab-acquire2-20180622-20260715T024500Z'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Package exact current main files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh/docs/csv
          cp docs/research_prompt.md fresh/docs/research_prompt.md
          cp docs/csv/news_20180622.csv fresh/docs/csv/news_20180622.csv
          cp docs/example2.md fresh/docs/example2.md
          python - <<'PY'
          import csv,hashlib,json
          from datetime import datetime
          from pathlib import Path
          p=Path('fresh/docs/research_prompt.md').read_bytes()
          npath=Path('fresh/docs/csv/news_20180622.csv'); n=npath.read_bytes()
          assert hashlib.sha256(p).hexdigest()=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029'
          assert len(p)==430485
          assert p.decode('utf-8').splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          with npath.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          ts=[]; bad=[]
          for i,r in enumerate(rows,1):
              try: ts.append(datetime.fromisoformat(f"{r['date']}T{r['time']}+09:00"))
              except Exception: bad.append(i)
          receipt={'status':'VERIFIED','prompt_sha256':hashlib.sha256(p).hexdigest(),'prompt_byte_size':len(p),'news_sha256':hashlib.sha256(n).hexdigest(),'news_byte_size':len(n),'csv_row_count':len(rows),'min_published_at':min(ts).isoformat(),'max_published_at':max(ts).isoformat(),'time_unverified_rows':bad}
          Path('fresh/acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nslab-fresh-inputs2-20180622-20260715T024500Z
          path: fresh/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
