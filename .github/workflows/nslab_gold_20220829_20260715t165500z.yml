name: NSLAB gold 20220829 20260715T165500Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nslab_gold_20220829_20260715t165500z.yml'

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: nslab-gold-20220829-20260715T165500Z
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Materialize current-date runner from fresh repository source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('temp/nslab_runner_20220826_20260715t130039.py')
          if not source.is_file():
              raise SystemExit(f'missing fresh repository runner source: {source}')
          text = source.read_text(encoding='utf-8')

          def set_assign(name, value):
              global text
              pattern = rf'(?m)^{re.escape(name)}\s*=\s*.*$'
              text, count = re.subn(pattern, f'{name} = {value!r}', text, count=1)
              if count != 1:
                  raise RuntimeError(f'assignment patch failed: {name}')

          set_assign('TRADE_DATE', '2022-08-29')
          set_assign('DATE8', '20220829')
          set_assign('PREVIOUS_TRADE_DATE', '2022-08-26')
          set_assign('NEXT_TRADE_DATE', '2022-08-30')
          set_assign('STAMP', '20260715T165500Z')

          # Protect the old D snapshot path before moving the old P snapshot one day forward.
          text = text.replace('atlas/research_daily/snapshots/2022/08/20220826.csv', '__NSLAB_OUTCOME_SNAPSHOT__')
          text = text.replace('atlas/research_daily/snapshots/2022/08/20220825.csv', 'atlas/research_daily/snapshots/2022/08/20220826.csv')
          text = text.replace('__NSLAB_OUTCOME_SNAPSHOT__', 'atlas/research_daily/snapshots/2022/08/20220829.csv')
          text = text.replace('atlas/research_daily/access/2022/08/20220826.json', 'atlas/research_daily/access/2022/08/20220829.json')
          text = text.replace('news_20220826', 'news_20220829')
          text = text.replace('20220826_nslab_episode_bundle.md', '20220829_nslab_episode_bundle.md')
          text = text.replace('outcome_snapshot_20220826_', 'outcome_snapshot_20220829_')
          text = text.replace('20220826_20260715t130039', '20220829_20260715t165500z')
          text = text.replace('2022-08-26T08:59:59+09:00', '2022-08-29T08:59:59+09:00')
          text = text.replace('2022-08-25T15:30:00+09:00', '2022-08-26T15:30:00+09:00')
          text = text.replace('2022-08-29T00:00:00+09:00', '2022-08-30T00:00:00+09:00')
          text = text.replace('2022-08-26T08:59:59', '2022-08-29T08:59:59')

          # The standalone source predates the workflow-only receipt patch; restore the example pointer.
          needle = '        "news_byte_size": len(news_raw),\n        "csv_row_count": len(news_rows),'
          replacement = (
              '        "news_byte_size": len(news_raw),\n'
              '        "example_file": example_name,\n'
              '        "example_sha256": example_sha,\n'
              '        "example_byte_size": len(example_raw),\n'
              '        "csv_row_count": len(news_rows),'
          )
          if needle not in text:
              raise RuntimeError('example receipt insertion point missing')
          text = text.replace(needle, replacement, 1)

          # Reassert no old selected-date input or price route survived the adaptation.
          forbidden = [
              'news_20220826.csv',
              'access/2022/08/20220826.json',
              'snapshots/2022/08/20220825.csv',
              '20220826_nslab_episode_bundle.md',
          ]
          present = [item for item in forbidden if item in text]
          if present:
              raise RuntimeError(f'stale date route survived: {present}')

          target = Path('temp/nslab_runner_20220829_20260715t165500z.py')
          target.write_text(text, encoding='utf-8')
          print(target)
          PY
          python -m py_compile temp/nslab_runner_20220829_20260715t165500z.py

      - name: Run full clean BLIND seal, post-seal outcome, postmortem, and final reparse
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python temp/nslab_runner_20220829_20260715t165500z.py
          test -s final_artifact_20220829_20260715t165500z/20220829_nslab_episode_bundle.md
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('final_artifact_20220829_20260715t165500z')
          final=root/'20220829_nslab_episode_bundle.md'
          receipt=json.loads((root/'independent_final_validation_receipt.json').read_text(encoding='utf-8'))
          assert receipt['status']=='ACCEPT_FULL'
          assert receipt['csv_row_count']==1927
          assert receipt['outcome_ledger_count']==2435
          assert receipt['brain_delta_record_count']>0
          text=final.read_text(encoding='utf-8')
          assert text.startswith('---\n')
          assert '<!-- NSLAB:BEGIN brain_delta.jsonl -->' in text
          assert '<!-- NSLAB:BEGIN validation_report.json -->' in text
          assert '<!-- NSLAB:BEGIN direct_ingest_contract.json -->' in text
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Upload independently validated episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: nslab-final-20220829-20260715T165500Z
          path: final_artifact_20220829_20260715t165500z/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  report:
    if: always()
    needs: [research]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Persist current-run result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RESEARCH_RESULT: ${{ needs.research.result }}
        shell: bash
        run: |
          set -euo pipefail
          out='temp/nslab_current_run_20220829_20260715t165500z'
          rm -rf "$out" downloaded
          mkdir -p "$out"
          printf '{"run_id":%s,"research_result":"%s","workflow":"NSLAB gold 20220829 20260715T165500Z"}\n' "$RUN_ID" "$RESEARCH_RESULT" > "$out/workflow_status.json"
          if [ "$RESEARCH_RESULT" = success ]; then
            gh run download "$RUN_ID" --repo Daikisong/new_bot --name nslab-final-20220829-20260715T165500Z --dir downloaded
            cp -a downloaded/. "$out/"
          else
            gh run view "$RUN_ID" --repo Daikisong/new_bot --log-failed > "$out/failed_log.txt" 2>&1 || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m "temp: persist NSLAB 20220829 run ${RUN_ID} result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
