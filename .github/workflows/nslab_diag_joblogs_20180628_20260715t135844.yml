name: NSLAB diagnostic job logs 20180628 20260715T135844

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: github.head_ref == 'nslab-diag-joblogs-20180628-20260715t135844'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download completed job logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          url='https://api.github.com/repos/Daikisong/new_bot/actions/jobs/87345505087/logs'
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'NSLAB-joblog-diagnostic'})
          with urllib.request.urlopen(req,timeout=180) as r:
              data=r.read()
          open('joblogs.zip','wb').write(data)
          print('bytes',len(data))
          PY
          unzip -l joblogs.zip
          mkdir -p extracted
          unzip -o joblogs.zip -d extracted
          find extracted -type f -maxdepth 3 -print -exec wc -c {} \;
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: nslab-joblogs-20180628-20260715T135844
          path: |
            joblogs.zip
            extracted/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
