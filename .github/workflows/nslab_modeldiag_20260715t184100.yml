name: NSLAB model limits diagnostic 20260715T184100

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  models: read

jobs:
  diagnose:
    if: github.head_ref == 'nslab-modeldiag-20260715t184100'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe representative gpt-4o semantic batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv, io, json, os, time, urllib.request, urllib.error
          with urllib.request.urlopen('https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220826.csv',timeout=120) as r:
            text=r.read().decode('utf-8-sig')
          raw_rows=list(csv.DictReader(io.StringIO(text)))[:18]
          batch=[]
          for i,row in enumerate(raw_rows,1):
            batch.append({'source_id':f'SRC-NEWS-{i:06d}','published_at_kst':f"{row['date']}T{row['time']}+09:00",'title':row['title'],'body':row['body'],'krx_candidate_options':[]})
          system='You are an independent semantic adjudicator for Korean pre-open stock news. Read every complete title and body. Return strict JSON only.'
          user='''Return {"records":[...]} with exactly one record per INPUT_ROWS item. Each record must include source_id, disposition, article_subject_company_or_null, local_predicate_owner_or_null, direct_issuer_relation, review_decision, exact_quote, chosen_ticker_or_null, chosen_company_or_null, issuer_binding_status, issuer_role_anchor_type, quote_role, material_fact_class, catalyst_type, economic_variable_changed, mechanism_sentence, mechanism_supported, candidate_path, screening_recommendation, decision_reason_specific, rejection_reason_or_null, semantic_risk_flags, theme_name_or_null, named_beneficiary_explicit. Use exact source substrings and do not invent tickers. INPUT_ROWS:\n'''+json.dumps(batch,ensure_ascii=False)
          body={'model':'openai/gpt-4o','messages':[{'role':'system','content':system},{'role':'user','content':user}],'temperature':0,'max_tokens':15000}
          req=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          started=time.monotonic()
          try:
            with urllib.request.urlopen(req,timeout=300) as r:
              raw=r.read().decode(); payload=json.loads(raw); content=payload['choices'][0]['message']['content']
              print(json.dumps({'status':r.status,'elapsed':round(time.monotonic()-started,3),'remaining_requests':r.headers.get('x-ratelimit-remaining-requests'),'remaining_tokens':r.headers.get('x-ratelimit-remaining-tokens'),'finish_reason':payload['choices'][0].get('finish_reason'),'content_chars':len(content),'content_prefix':content[:500]},ensure_ascii=False,sort_keys=True))
          except urllib.error.HTTPError as e:
            print(json.dumps({'status':e.code,'elapsed':round(time.monotonic()-started,3),'rate_type':e.headers.get('x-ratelimit-type'),'retry_after':e.headers.get('Retry-After'),'error_code':e.headers.get('x-ms-error-code'),'body':e.read().decode(errors='replace')[:1000]},sort_keys=True)); raise
          PY
