name: NSLAB acquire 20180613 20260714T063250Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-acquire-20180613-20260714T063250Z'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch fresh main Raw bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquired
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const nonce = '20260714T063250Z_20180613_1157';
          const targets = [
            ['https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md', 'acquired/prompt_tmp.md'],
            ['https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20180613.csv', 'acquired/news_20180613_tmp.csv']
          ];
          (async () => {
            const manifest = {};
            for (const [url, path] of targets) {
              const response = await fetch(url + '?nslab_run=' + nonce, {
                redirect: 'follow',
                headers: {
                  'cache-control': 'no-cache',
                  'pragma': 'no-cache',
                  'user-agent': 'nslab-gold-phase-machine/20180613'
                }
              });
              if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              fs.writeFileSync(path, bytes);
              manifest[path] = {
                url,
                fetched_at_utc: new Date().toISOString(),
                byte_size: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex')
              };
            }
            fs.writeFileSync('acquired/acquisition_manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload freshly acquired bytes
        uses: actions/upload-artifact@v4
        with:
          name: nslab-acquire-20180613-20260714T063250Z
          path: acquired/
          if-no-files-found: error
          retention-days: 1
