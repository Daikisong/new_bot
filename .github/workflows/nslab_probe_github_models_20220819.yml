name: NSLAB probe GitHub Models 20220819

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  models: read

jobs:
  probe:
    if: github.head_ref == 'nslab-20220819-20260714t131120'
    runs-on: ubuntu-latest
    steps:
      - name: Probe one inference call
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url='https://models.github.ai/inference/chat/completions'
          body={
            'model':'openai/gpt-4.1-mini',
            'messages':[{'role':'user','content':'Return only the JSON object {"ok":true}.'}],
            'temperature':0,
            'max_tokens':30,
          }
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={
            'Authorization':'Bearer '+os.environ['GH_MODELS_TOKEN'],
            'Content-Type':'application/json',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
          })
          out={'success':False}
          try:
            with urllib.request.urlopen(req,timeout=60) as resp:
              data=json.loads(resp.read().decode())
              out={'success':True,'model':data.get('model'),'content':data.get('choices',[{}])[0].get('message',{}).get('content')}
          except Exception as e:
            out={'success':False,'error_type':type(e).__name__,'error':str(e)[:500]}
          open('payload/github_models_probe.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nslab-github-models-probe-20220819
          path: payload/github_models_probe.json
          retention-days: 1
          if-no-files-found: error
