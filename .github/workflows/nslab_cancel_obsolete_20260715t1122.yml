name: NSLAB cancel obsolete runs 20260715T1122

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    if: github.head_ref == 'nslab-cancel-obsolete-20260715t1122'
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete model-heavy runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for run_id in 29406819899 29404871314 29403008696; do
            gh api --method POST "repos/Daikisong/new_bot/actions/runs/${run_id}/cancel" || true
          done
