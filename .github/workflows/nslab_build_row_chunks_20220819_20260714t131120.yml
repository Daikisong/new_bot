name: NSLAB build row chunks 20220819 20260714t131120

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  build_chunks:
    if: github.head_ref == 'nslab-20220819-20260714t131120'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch for chunk commit
        uses: actions/checkout@v4
        with:
          ref: nslab-20220819-20260714t131120
          path: work
          fetch-depth: 0

      - name: Checkout exact main CSV
        uses: actions/checkout@v4
        with:
          repository: Daikisong/new_bot
          ref: main
          path: source_main
          sparse-checkout: |
            docs/csv/news_20220819.csv
          sparse-checkout-cone-mode: false

      - name: Build full-text row chunks
        shell: bash
        run: |
          set -euo pipefail
          target='work/temp/nslab_20220819/full_text_chunks'
          if [ -f "$target/COMPLETE.json" ]; then
            echo 'chunks already committed'
            exit 0
          fi
          rm -rf "$target"
          mkdir -p "$target"
          python - <<'PY'
          import csv, json, hashlib
          from pathlib import Path
          src=Path('source_main/docs/csv/news_20220819.csv')
          out=Path('work/temp/nslab_20220819/full_text_chunks')
          raw=src.read_bytes()
          with src.open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          chunk_size=20
          for start in range(0,len(rows),chunk_size):
              end=min(start+chunk_size,len(rows))
              p=out/f'rows_{start+1:04d}_{end:04d}.txt'
              parts=[]
              for idx in range(start,end):
                  r=rows[idx]
                  parts.append(f'===== SRC-{idx+1:06d} | CSV_ROW {idx+1} | {r["date"]} {r["time"]} =====\nTITLE: {r["title"]}\nBODY:\n{r["body"]}\n')
              p.write_text('\n'.join(parts),encoding='utf-8')
          (out/'COMPLETE.json').write_text(json.dumps({'input_sha256':hashlib.sha256(raw).hexdigest(),'row_count':len(rows),'chunk_size':chunk_size,'chunk_count':(len(rows)+chunk_size-1)//chunk_size},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd work
          git config user.name 'nslab-temp-runner'
          git config user.email 'nslab-temp-runner@users.noreply.github.com'
          git add temp/nslab_20220819/full_text_chunks
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'temp: add full-text row chunks for NSLAB 20220819 [skip ci]'
          git push origin HEAD:nslab-20220819-20260714t131120
