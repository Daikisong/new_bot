name: NSLAB acquire 20180614 20260714t064102z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-acquire-20180614-20260714t064102z'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch fresh pre-seal Raw bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquired
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const targets = [
            ['https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md', 'acquired/prompt_tmp.md'],
            ['https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20180614.csv', 'acquired/news_20180614_tmp.csv'],
            ['https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/access/2018/06/20180614.json', 'acquired/access_20180614_tmp.json'],
            ['https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180612.csv', 'acquired/blind_20180612_tmp.csv']
          ];
          (async () => {
            const manifest = {};
            for (const [url, path] of targets) {
              const response = await fetch(url + '?nslab_run=20260714t064102z', {
                redirect: 'follow',
                headers: {
                  'cache-control': 'no-cache',
                  'pragma': 'no-cache',
                  'user-agent': 'nslab-gold-phase-machine/20180614'
                }
              });
              if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              fs.writeFileSync(path, bytes);
              manifest[path] = {
                url,
                byte_size: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex')
              };
            }
            fs.writeFileSync('acquired/acquisition_manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload fresh pre-seal bytes
        uses: actions/upload-artifact@v4
        with:
          name: nslab-acquire-20180614-20260714t064102z
          path: acquired/
          if-no-files-found: error
          retention-days: 1
