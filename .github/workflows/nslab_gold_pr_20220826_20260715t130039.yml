name: NSLAB gold PR 20220826 20260715T130039

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: nslab-gold-pr-20220826-20260715T130039-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.head_ref == 'nslab-run-20220826-20260715t130039'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current main research inputs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            docs/research_prompt.md
            docs/csv/news_20220826.csv
            docs/example2.md
            temp/nslab_runner_20220826_20260715t130039.py
            temp/nslab_runner_wrapper_20220826_20260715t130039.py
          sparse-checkout-cone-mode: false
      - name: Execute full gold phase machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python temp/nslab_runner_wrapper_20220826_20260715t130039.py
      - name: Upload independently validated episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: nslab-final-20220826-20260715T130039
          path: final_artifact_20220826_20260715t130039/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
