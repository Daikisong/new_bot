name: NSLAB acquire Windows 20180619 20260714T095119Z

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire_windows:
    if: github.head_ref == 'nslab-acquire-20180619-20260714T095119Z'
    runs-on: windows-latest
    steps:
      - name: Fetch fresh Raw bytes for prompt, news, and blind snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force acquired | Out-Null
          @'
          const fs = require('fs');
          const crypto = require('crypto');
          const targets = [
            ['https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md', 'acquired/prompt_tmp.md'],
            ['https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20180619.csv', 'acquired/news_20180619_tmp.csv'],
            ['https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2018/06/20180618.csv', 'acquired/blind_20180618_tmp.csv']
          ];
          (async () => {
            const manifest = {};
            for (const [url, path] of targets) {
              const response = await fetch(url + '?nslab_run=20260714T095119Z_windows', {
                redirect: 'follow',
                headers: {'cache-control':'no-cache','pragma':'no-cache','user-agent':'nslab-gold-phase-machine/20180619-windows'}
              });
              if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              fs.writeFileSync(path, bytes);
              manifest[path] = {url, byte_size: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex')};
            }
            fs.writeFileSync('acquired/acquisition_manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          '@ | Set-Content -Encoding utf8 acquire.js
          node acquire.js

      - name: Upload freshly acquired bytes
        uses: actions/upload-artifact@v4
        with:
          name: nslab-acquire-windows-20180619-20260714T095119Z
          path: acquired/
          if-no-files-found: error
          retention-days: 1
