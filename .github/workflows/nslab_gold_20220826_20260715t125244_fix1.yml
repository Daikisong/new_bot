name: NSLAB gold 20220826 20260715T125244 fix1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nslab_gold_20220826_20260715t125244_fix1.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: nslab-gold-20220826-20260715T125244-fix1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  gold:
    if: github.event_name == 'push' || github.head_ref == 'nslab-run-20220826-20260715t125244-fix1'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current new_bot main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout BLIND-safe stock-web inputs only
        uses: actions/checkout@v4
        with:
          repository: Daikisong/stock-web
          ref: main
          path: stock_blind
          sparse-checkout: |
            atlas/research_daily/manifest.json
            atlas/research_daily/schema.json
            atlas/research_daily/trading_calendar.csv
            atlas/research_daily/access/2022/08/20220826.json
            atlas/research_daily/snapshots/2022/08/20220825.csv
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Fresh Raw/API acquisition, full parse, and phase-machine preparation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/inputs work/pipeline work/logs
          git fetch origin 38299bfe2d296e4a8dbbaad04de2001fd63ba88a --depth=1
          for f in common.py blind.py reseal.py postmortem.py; do
            git show 38299bfe2d296e4a8dbbaad04de2001fd63ba88a:temp/nslab_20220819_pipeline/$f > work/pipeline/$f
          done
          python - <<'PY'
          import csv, hashlib, json, os, re, urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path

          root=Path('work'); inputs=root/'inputs'; pipeline=root/'pipeline'
          token=os.environ['GITHUB_TOKEN']
          warnings=[]; methods={}
          def fetch_exact(raw_url, api_url, dest, label):
              headers={'Authorization':f'Bearer {token}','User-Agent':'NSLAB-current-run-20220826-fix1'}
              try:
                  req=urllib.request.Request(raw_url,headers={**headers,'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'})
                  with urllib.request.urlopen(req,timeout=180) as r: data=r.read()
                  methods[label]='GITHUB_RAW_EXACT_URL'
              except Exception as exc:
                  warnings.append({'stage':'RAW_ACQUISITION','label':label,'warning':f'{type(exc).__name__}: {exc}','fallback':'GITHUB_API_RAW_AFTER_WEB_RAW_OPEN'})
                  req=urllib.request.Request(api_url,headers={**headers,'Accept':'application/vnd.github.raw+json'})
                  with urllib.request.urlopen(req,timeout=180) as r: data=r.read()
                  methods[label]='GITHUB_API_RAW_FALLBACK_AFTER_WEB_RAW_OPEN'
              dest.write_bytes(data)
              return data

          prompt_tmp=root/'prompt_tmp.md'; news_tmp=root/'news_20220826_tmp.csv'; example_tmp=root/'example2_tmp.md'
          prompt_raw=fetch_exact('https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md?run=20260715T125244KST-fix1','https://api.github.com/repos/Daikisong/new_bot/contents/docs/research_prompt.md?ref=main',prompt_tmp,'prompt')
          news_raw=fetch_exact('https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220826.csv?run=20260715T125244KST-fix1','https://api.github.com/repos/Daikisong/new_bot/contents/docs/csv/news_20220826.csv?ref=main',news_tmp,'news')
          example_raw=fetch_exact('https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/example2.md?run=20260715T125244KST-fix1','https://api.github.com/repos/Daikisong/new_bot/contents/docs/example2.md?ref=main',example_tmp,'example')

          assert prompt_raw == Path('docs/research_prompt.md').read_bytes()
          assert news_raw == Path('docs/csv/news_20220826.csv').read_bytes()
          assert example_raw == Path('docs/example2.md').read_bytes()
          psha=hashlib.sha256(prompt_raw).hexdigest(); nsha=hashlib.sha256(news_raw).hexdigest(); esha=hashlib.sha256(example_raw).hexdigest()
          assert psha=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029'
          assert len(prompt_raw)==430485
          ptext=prompt_raw.decode('utf-8')
          assert ptext.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert 'nslab.gold_phase_machine.direct_csv_research.locked' in ptext
          with news_tmp.open('r',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          times=[]; time_unverified=[]
          for i,row in enumerate(rows,1):
              try: times.append(datetime.fromisoformat(f"{row['date']}T{row['time']}"))
              except Exception: time_unverified.append(i)
          access=json.loads(Path('stock_blind/atlas/research_daily/access/2022/08/20220826.json').read_text(encoding='utf-8'))
          blind=Path('stock_blind/atlas/research_daily/snapshots/2022/08/20220825.csv')
          blind_raw=blind.read_bytes(); blind_sha=hashlib.sha256(blind_raw).hexdigest()
          with blind.open('r',encoding='utf-8-sig',newline='') as f: blind_rows=list(csv.DictReader(f))
          assert access['trade_date']=='2022-08-26' and access['previous_trade_date']=='2022-08-25' and access['next_trade_date']=='2022-08-29'
          assert access['blind_snapshot_path']=='atlas/research_daily/snapshots/2022/08/20220825.csv'
          assert access['outcome_snapshot_path']=='atlas/research_daily/snapshots/2022/08/20220826.csv'
          assert blind_sha==access['blind_snapshot_sha256'] and len(blind_raw)==access['blind_snapshot_bytes'] and len(blind_rows)==access['blind_snapshot_row_count']
          assert max(r.get('max_source_date','') for r in blind_rows)<='2022-08-25'
          stamp='20260715T125244KST_fix1'
          prompt_name=f'research_prompt_{stamp}_{psha[:8]}.md'; news_name=f'news_20220826_{stamp}_{nsha[:8]}.csv'; example_name=f'example2_{stamp}_{esha[:8]}.md'
          prompt_tmp.rename(inputs/prompt_name); news_tmp.rename(inputs/news_name); example_tmp.rename(inputs/example_name)
          cutoff=datetime.fromisoformat('2022-08-26T08:59:59'); uncovered=[]
          if times and max(times)<cutoff: uncovered.append(f"{(max(times)+timedelta(seconds=1)).isoformat()}..{cutoff.isoformat()}")
          receipt={
            'schema_version':'nslab.current_run_raw_acquisition.v1','run_id':'nslab_run_20260715T125244KST_fix1_20220826',
            'prompt_file':prompt_name,'prompt_sha256':psha,'prompt_byte_size':len(prompt_raw),
            'news_file':news_name,'news_sha256':nsha,'news_byte_size':len(news_raw),
            'example_file':example_name,'example_sha256':esha,'example_byte_size':len(example_raw),
            'csv_row_count':len(rows),'parsed_row_count':len(rows),'columns':list(rows[0]),
            'min_published_at':min(times).isoformat() if times else None,'max_published_at':max(times).isoformat() if times else None,
            'time_unverified_rows':time_unverified,'control_char_count':sum(1 for ch in news_raw.decode('utf-8-sig') if ord(ch)<32 and ch not in '\n\r\t'),
            'trade_date':'2022-08-26','previous_trade_date':'2022-08-25','next_trade_date':'2022-08-29',
            'input_coverage_warning':None if not uncovered else 'CSV max timestamp is before 08:59:59 KST cutoff.','uncovered_time_ranges':uncovered,
            'blind_snapshot_sha256':blind_sha,'blind_snapshot_byte_size':len(blind_raw),'blind_snapshot_row_count':len(blind_rows),
            'outcome_snapshot_sha256_expected':access['outcome_snapshot_sha256'],'outcome_snapshot_byte_size_expected':access['outcome_snapshot_bytes'],'outcome_snapshot_row_count_expected':access['outcome_snapshot_row_count'],
            'raw_urls_opened':{'prompt':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md','news':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220826.csv','example':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/example2.md'},
            'acquisition_methods':methods,'acquisition_warnings':warnings,
            'preseal_outcome_download_count':0,'preseal_outcome_header_read_count':0,'preseal_outcome_sha256_count':0,'preseal_outcome_row_count_count':0,'preseal_outcome_parse_count':0
          }
          (root/'acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/'acquisition_warnings.jsonl').write_text('\n'.join(json.dumps(x,ensure_ascii=False,sort_keys=True) for x in warnings)+('\n' if warnings else ''),encoding='utf-8')

          def set_assign(text,name,value):
              pat=rf'(?m)^{re.escape(name)}\s*=\s*.*$'
              out,n=re.subn(pat,f'{name} = {value!r}',text,count=1)
              assert n==1,name
              return out
          common=(pipeline/'common.py').read_text(encoding='utf-8')
          vals={
            'TRADE_DATE':'2022-08-26','PREVIOUS_TRADE_DATE':'2022-08-25','NEXT_TRADE_DATE':'2022-08-29',
            'CUTOFF_AT':'2022-08-26T08:59:59+09:00','WINDOW_START':'2022-08-25T15:30:00+09:00','AVAILABLE_FROM':'2022-08-29T00:00:00+09:00',
            'INPUT_SHA256':nsha,'INPUT_BYTE_SIZE':len(news_raw),'INPUT_ROW_COUNT':len(rows),
            'PROMPT_SHA256':psha,'PROMPT_BYTE_SIZE':len(prompt_raw),
            'BLIND_SNAPSHOT_SHA256':blind_sha,'BLIND_SNAPSHOT_ROWS':len(blind_rows),
            'OUTCOME_SNAPSHOT_SHA256':access['outcome_snapshot_sha256'],'OUTCOME_SNAPSHOT_BYTES':access['outcome_snapshot_bytes'],'OUTCOME_SNAPSHOT_ROWS':access['outcome_snapshot_row_count'],
            'MODEL_NAME':'openai/gpt-4.1-mini'}
          for k,v in vals.items(): common=set_assign(common,k,v)
          common=common.replace('20220819','20220826').replace('2022-08-19','2022-08-26').replace('2022-08-18','2022-08-25').replace('2022-08-22','2022-08-29')
          (pipeline/'common.py').write_text(common,encoding='utf-8')
          for filename in ('blind.py','reseal.py','postmortem.py'):
              path=pipeline/filename; text=path.read_text(encoding='utf-8')
              text=text.replace('20220819','20220826').replace('2022-08-19','2022-08-26').replace('2022-08-18','2022-08-25').replace('2022-08-22','2022-08-29')
              text=text.replace('ec55b86339923c35db8c7b31e01f1706213afa3ffdb535aac243f2fd56a454fb',nsha)
              path.write_text(text,encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
          python -m py_compile work/pipeline/common.py work/pipeline/blind.py work/pipeline/reseal.py work/pipeline/postmortem.py

      - name: Full CSV semantic review, denominator closure, BLIND ranking, and clean seal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: work/pipeline
        run: |
          set -euo pipefail
          PROMPT=$(python -c "import json;print('work/inputs/'+json.load(open('work/acquisition_receipt.json'))['prompt_file'])")
          NEWS=$(python -c "import json;print('work/inputs/'+json.load(open('work/acquisition_receipt.json'))['news_file'])")
          EXAMPLE=$(python -c "import json;print('work/inputs/'+json.load(open('work/acquisition_receipt.json'))['example_file'])")
          python work/pipeline/blind.py --prompt "$PROMPT" --news "$NEWS" --access stock_blind/atlas/research_daily/access/2022/08/20220826.json --manifest stock_blind/atlas/research_daily/manifest.json --schema stock_blind/atlas/research_daily/schema.json --blind-snapshot stock_blind/atlas/research_daily/snapshots/2022/08/20220825.csv --example "$EXAMPLE" --output work/blind --token "$GITHUB_TOKEN" --run-id nslab_run_20260715T125244KST_fix1_20220826

      - name: Verify clean BLIND seal before any outcome access
        shell: bash
        env:
          PYTHONPATH: work/pipeline
        run: |
          set -euo pipefail
          test ! -e stock_blind/atlas/research_daily/snapshots/2022/08/20220826.csv
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('work/blind/artifacts')
          manifest=json.loads((root/'blind_packet_manifest.json').read_text(encoding='utf-8'))
          receipt=json.loads((root/'blind_seal_receipt.json').read_text(encoding='utf-8'))
          payload=json.dumps(manifest,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(payload).hexdigest()==receipt['blind_packet_manifest_sha256']
          assert receipt['blind_packet_manifest_verified'] is True
          assert receipt['preseal_outcome_access_all_zero'] is True
          assert receipt['seal_status']=='VERIFIED_CLEAN'
          for key in ['preseal_outcome_download_count','preseal_outcome_header_read_count','preseal_outcome_sha256_count','preseal_outcome_row_count_count','preseal_outcome_parse_count']: assert receipt[key]==0,(key,receipt[key])
          print(receipt['blind_packet_manifest_sha256'])
          PY

      - name: Checkout D outcome only after verified seal
        uses: actions/checkout@v4
        with:
          repository: Daikisong/stock-web
          ref: main
          path: stock_outcome
          sparse-checkout: |
            atlas/research_daily/snapshots/2022/08/20220826.csv
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Acquire post-seal outcome, run full postmortem, render and reparse
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: work/pipeline
        run: |
          set -euo pipefail
          mkdir -p post_inputs post_output
          python - <<'PY'
          import csv,hashlib,json,urllib.request
          from pathlib import Path
          receipt=json.loads(Path('work/acquisition_receipt.json').read_text(encoding='utf-8'))
          raw_url='https://raw.githubusercontent.com/Daikisong/stock-web/refs/heads/main/atlas/research_daily/snapshots/2022/08/20220826.csv?run=20260715T125244KST-fix1'
          method='GITHUB_RAW_EXACT_URL_POST_SEAL'
          try:
              req=urllib.request.Request(raw_url,headers={'User-Agent':'NSLAB-current-run-20220826-fix1','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=180) as r: data=r.read()
          except Exception as exc:
              method='PUBLIC_CHECKOUT_BYTE_PARITY_AFTER_RAW_OPEN'
              data=Path('stock_outcome/atlas/research_daily/snapshots/2022/08/20220826.csv').read_bytes()
              Path('post_inputs/outcome_acquisition_warning.txt').write_text(f'{type(exc).__name__}: {exc}\n',encoding='utf-8')
          checkout=Path('stock_outcome/atlas/research_daily/snapshots/2022/08/20220826.csv').read_bytes(); assert data==checkout
          sha=hashlib.sha256(data).hexdigest(); assert sha==receipt['outcome_snapshot_sha256_expected']; assert len(data)==receipt['outcome_snapshot_byte_size_expected']
          temp=Path('post_inputs/outcome_tmp.csv'); temp.write_bytes(data)
          with temp.open('r',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==receipt['outcome_snapshot_row_count_expected']
          name=f'outcome_snapshot_20220826_20260715T125244KST_fix1_{sha[:8]}.csv'; temp.rename(Path('post_inputs')/name)
          Path('post_inputs/outcome_receipt.json').write_text(json.dumps({'file':name,'sha256':sha,'byte_size':len(data),'row_count':len(rows),'acquisition_method':method,'seal_verified_before_download':True},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          OUTCOME=$(python -c "import json;print('post_inputs/'+json.load(open('post_inputs/outcome_receipt.json'))['file'])")
          python work/pipeline/postmortem.py --blind-dir work/blind --outcome "$OUTCOME" --output post_output --token "$GITHUB_TOKEN" --run-id nslab_run_20260715T125244KST_fix1_20220826
          test -s post_output/20220826_nslab_episode_bundle.md
          test -s post_output/final_reparse_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          import common
          acq=json.loads(Path('work/acquisition_receipt.json').read_text(encoding='utf-8'))
          receipt=json.loads(Path('post_output/final_reparse_receipt.json').read_text(encoding='utf-8'))
          final=Path('post_output/20220826_nslab_episode_bundle.md'); text=final.read_text(encoding='utf-8')
          assert text.startswith('---\n')
          blocks=common.parse_markdown_blocks(text)
          brain=common.parse_block(blocks['brain_delta.jsonl'],'brain_delta.jsonl')
          manifest=common.parse_block(blocks['bundle_manifest.json'],'bundle_manifest.json')
          validation=common.parse_block(blocks['validation_report.json'],'validation_report.json')
          contract=common.parse_block(blocks['direct_ingest_contract.json'],'direct_ingest_contract.json')
          assert receipt['status']=='ACCEPT_FULL'
          assert receipt['csv_row_count']==acq['csv_row_count']
          assert receipt['outcome_ledger_count']==acq['outcome_snapshot_row_count_expected']
          assert receipt['brain_delta_record_count']>0 and len(brain)==receipt['brain_delta_record_count']
          assert receipt['brain_delta_payload_missing_count']==0
          assert receipt['brain_delta_manifest_payload_count_mismatch_count']==0
          assert receipt['brain_delta_declared_without_payload_count']==0
          assert manifest['files']['brain_delta.jsonl']['row_count']==len(brain)
          assert validation['status']=='ACCEPT_FULL'
          assert contract['direct_brain_ingest_ready'] is True and contract['brain_eligible'] is True
          independent={'status':'ACCEPT_FULL','csv_row_count':acq['csv_row_count'],'outcome_ledger_count':acq['outcome_snapshot_row_count_expected'],'brain_delta_record_count':len(brain),'brain_delta_payload_missing_count':0,'brain_delta_manifest_payload_count_mismatch_count':0,'brain_delta_declared_without_payload_count':0}
          Path('post_output/independent_final_validation_receipt.json').write_text(json.dumps(independent,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(independent,sort_keys=True))
          PY

      - name: Upload independently validated episode bundle
        uses: actions/upload-artifact@v4
        with:
          name: nslab-final-20220826-20260715T125244-fix1
          path: |
            post_output/20220826_nslab_episode_bundle.md
            post_output/independent_final_validation_receipt.json
            post_output/final_reparse_receipt.json
            work/acquisition_receipt.json
            work/blind/blind_completion_receipt.json
            work/blind/artifacts/blind_seal_receipt.json
            post_inputs/outcome_receipt.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Persist run status and validated bundle to main
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          out='temp/nslab_current_run_20220826_20260715t125244_fix1'
          rm -rf "$out"
          mkdir -p "$out"
          printf '{"status":"%s","workflow":"NSLAB gold 20220826 20260715T125244 fix1"}\n' "$JOB_STATUS" > "$out/workflow_status.json"
          if [ "$JOB_STATUS" = success ]; then
            cp post_output/20220826_nslab_episode_bundle.md "$out/"
            cp post_output/independent_final_validation_receipt.json "$out/"
            cp post_output/final_reparse_receipt.json "$out/"
            cp work/acquisition_receipt.json "$out/"
            cp work/blind/blind_completion_receipt.json "$out/"
            cp work/blind/artifacts/blind_seal_receipt.json "$out/"
            cp post_inputs/outcome_receipt.json "$out/"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'temp: persist repaired NSLAB 20220826 result' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
